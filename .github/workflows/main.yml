name : quality gateway implementation

on:
  push:
    branches:
        - main
  
jobs:
  run-python-code:
    runs-on: ubuntu-latest
    steps:
       - name: checkout code
         uses: actions/checkout@v4
       - name: install required package
         run: pip install -r requirement.txt

       - name: run test case
         run: pytest --cov=calc --cov-report=term
